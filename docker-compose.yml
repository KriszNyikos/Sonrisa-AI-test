version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: alert-system-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/alerts.db
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@alertsystem.local
    volumes:
      - alert-data:/app/data
    networks:
      - alert-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: alert-system-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - alert-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # MailHog for local email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: alert-system-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - alert-network

volumes:
  alert-data:
    driver: local

networks:
  alert-network:
    driver: bridge

# Usage:
# docker compose up -d         # Start all services
# docker compose down          # Stop all services
# docker compose logs -f       # View logs
# docker compose ps            # Check status
